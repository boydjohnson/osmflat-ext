[workspace]
members = [
    "osmflat-ext",
    "osmflat-extc",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT/Apache-2.0"
repository = "https://github.com/boydjohnson/osmflat-ext"

[workspace.dependencies]
# The parent format. Pinned to the branch that carries the spatial-index + Ids
# work this crate is designed against.
osmflat = { git = "https://github.com/boydjohnson/osmflat-rs", branch = "feature/spatial-index" }
flatdata = "0.5.3"
